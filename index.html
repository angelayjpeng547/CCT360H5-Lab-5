<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab 5</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="parta">
      <h1>Part A: Soundscape</h1>
      <p>A 74 second soundscape of Suzhou, China, where my uncle is doing Taichi</p>
      <audio controls>
         <source src="audio/taichisound.mp3" type="audio/mp3">
         This browser does not support audio.
      </audio>
    </div>

    <div class="partb">
      <h1>Part B: Visualscape</h1>
      <p>A 72 second video of Shanghai, China. Please the three buttons below to interact with the video.</p>
      <video id="video" controls>
        <source src="video/shanghailandscape.mp4" type="video/mp4">
        This browser does not support video.
      </video>
    </div>

    <footer>
      <div class="controlspanel">
        <button class="btnplay" id="playBtn">Play VideoScape</button>
        <button class="btnpause" id="pauseBtn">Pause VideoScape</button>
        <button class="btnstop" id="stopBtn">Stop VideoScape</button>
        <div class="trackinfo">
          <p id="statusText">Videoscape Paused</p>
          <div class="progressbarcontainer" id="progressContainer">
            <div class="progressfill" id="progressFill">
          </div>
        </div>
      </div>
      </div>
    </footer>
    

  
      
  </body>

   <script src="script.js"></script> 
</html>
